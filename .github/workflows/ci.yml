name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # needed by the JUnit report action to publish check runs

env:
  JAVA_VERSION: "21"
  SOAPUI_VERSION: "5.9.1"
  APP_URL: http://localhost:8080

jobs:
  # --------------------------------------------------------------------------
  # 1) Compile, run JUnit tests, package the jar
  # --------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and run unit tests
        run: ./mvnw -B verify

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Unit tests
          report_paths: target/surefire-reports/TEST-*.xml

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 1

  # --------------------------------------------------------------------------
  # 2) Start the packaged app and run the SoapUI suite against it
  # --------------------------------------------------------------------------
  api-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download application jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar

      - name: Start application
        run: |
          nohup java -jar app.jar > app.log 2>&1 &
          echo "Waiting for $APP_URL/actuator/health ..."
          if ! timeout 90 bash -c "until curl -sf $APP_URL/actuator/health > /dev/null; do sleep 2; done"; then
            echo "::error::Application did not become healthy within 90s"
            cat app.log
            exit 1
          fi
          echo "Application is up"

      - name: Cache SoapUI
        id: cache-soapui
        uses: actions/cache@v6
        with:
          path: ~/soapui
          key: soapui-${{ env.SOAPUI_VERSION }}

      - name: Install SoapUI ${{ env.SOAPUI_VERSION }}
        if: steps.cache-soapui.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/soapui
          curl -fsSL "https://dl.eviware.com/soapuios/${SOAPUI_VERSION}/SoapUI-${SOAPUI_VERSION}-linux-bin.tar.gz" \
            | tar -xz -C ~/soapui --strip-components=1

      - name: Run SoapUI tests
        run: |
          # -j  JUnit-style XML reports      -f  report output folder
          # -r  print summary to the log     -P  set a project property
          # testrunner exits non-zero when any assertion fails, which fails this step.
          ~/soapui/bin/testrunner.sh \
            -j -r \
            -f "$GITHUB_WORKSPACE/reports/soapui" \
            -PbaseUrl="$APP_URL" \
            "$GITHUB_WORKSPACE/soapui/book-catalog-soapui-project.xml"

      - name: Publish SoapUI test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: SoapUI API tests
          report_paths: reports/soapui/**/*.xml
          require_tests: true

      - name: Upload SoapUI reports and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soapui-reports
          path: |
            reports/soapui/
            app.log
            ~/soapui/bin/soapui-errors.log
          if-no-files-found: ignore
